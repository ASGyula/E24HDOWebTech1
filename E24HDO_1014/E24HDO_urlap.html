<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <title>form</title>
  <style>
    h1{text-align: center;}
    body{font-family: Arial, sans-serif;}
    header{display: flex; flex-direction: column; justify-content: center; align-items: center;}
    section{padding: 8px; display: flex; flex-direction: column; border: 1px solid black; background-color: lightskyblue; border-radius: 8px; box-shadow: 2px 2px 5px rgba(0, 0, 0, 0.3);}
    form{padding: 8px;}
    footer{display: flex; flex-direction: column; justify-content: end; align-items: end;}
  </style>
</head>
<body>

<header>
  <h1>HTML 5 Űrlap - E24HDO</h1>
</header>

<section>
  <form id="myForm" action="feldolgozo.php" method="POST">
    <label for="nev">Név:</label>
    <input required autocomplete="off" pattern="[A-Za-zÀ-ÿ\s]{3,}" type="text" id="nev" name="nev" placeholder="Írd be a neved">
    <br><br>

    <label for="pin">PIN kód:</label>
    <input required type="text" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" id="pin" name="pin" placeholder="PIN kod">
    <br><br>

    <label for="fav_fruit">Kedvenc gyümölcs:</label>
    <input type="text" id="fav_fruit" name="fav_fruit" list="fruits">
    <datalist id="fruits">
      <option value="alma">
      <option value="banán">
      <option value="cseresznye">
      <option value="körte">
      <option value="szilva">
    </datalist>
    <br><br>

    <label for="age">Életkor:</label>
    <input type="number" min="1" max="100" id="age" name="age">
    <br><br>

    <label for="foot">Lábméret:</label>
    <input type="number" id="foot" min="25" max="50" step="0.5" name="foot">
    <br><br>

    <label for="self-confidence">Önbizalom:</label>
    <input type="range" min="0" max="100" id="self-confidence" name="self-confidence">
    <br><br>
  </form>

  <div>
    <button type="submit" form="myForm">Elküld</button>
    <button type="submit" form="myForm" formnovalidate>Elküld ellenőrzés nélkül</button>
  </div>
</section>

<footer>
  <p>forrás: <a href="http://html5doctor.com/" target="_blank" rel="noopener noreferrer">http://html5doctor.com/</a></p>
  <p>formátumok: <a href="https://html5pattern.com/" target="_blank" rel="noopener noreferrer">https://html5pattern.com/</a></p>
  <p>JavaScript RegExp: <a href="https://www.w3schools.com/jsref/jsref_obj_regexp.asp" target="_blank" rel="noopener noreferrer">https://www.w3schools.com/jsref/jsref_obj_regexp.asp</a></p>
</footer>

</body>
</html>
