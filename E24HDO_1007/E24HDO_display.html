<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <title>Display</title>

    <style>

        .XY1{
            display:none;
            background-color: #99FF99;
        }
        .XY2{
            display:inline;
            background-color: #99FF99;
        }
        .XY3{
            display:block;
            background-color: #99FF99;
        }
        .XY4{
            display:inline-block;
            background-color: #99FF99;
        }
        .XY5{
            display:flex;
            background-color: #99FF99;
        }

        .content{
            display: inline-block;
            padding: 2px;
            background-color: coral;
        }

    </style>

</head>
<body>

<h1>Megjelenítési tulajdonság</h1>

<div>
    <h3>display:none</h3>
    <div class="XY1">
        <div class="content">
            PTI BSc 1
        </div>
        <div class="content">
            PTI BSc 2
        </div>
        <div class="content">
            PTI BSc 3
        </div>
    </div>
</div>

<div>
    <h3>display:inline</h3>
    <div class="XY2">
        <div class="content">
            PTI BSc 1
        </div>
        <div class="content">
            PTI BSc 2
        </div>
        <div class="content">
            PTI BSc 3
        </div>
    </div>
</div>

<div>
    <h3>display:block</h3>
    <div class="XY3">
        <div class="content">
            PTI BSc 1
        </div>
        <div class="content">
            PTI BSc 2
        </div>
        <div class="content">
            PTI BSc 3
        </div>
    </div>
</div>
<div>
    <h3>display:block</h3>
    <div class="XY4">
        <div class="content">
            PTI BSc 1
        </div>
        <div class="content">
            PTI BSc 2
        </div>
        <div class="content">
            PTI BSc 3
        </div>
    </div>
</div>
<div>
    <h3>display:flex</h3>
    <div class="XY5">
        <div class="content">
            PTI BSc 1
        </div>
        <div class="content">
            PTI BSc 2
        </div>
        <div class="content">
            PTI BSc 3
        </div>
    </div>
</div>


</body>
</html>
