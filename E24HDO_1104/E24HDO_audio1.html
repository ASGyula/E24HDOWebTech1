<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <title>audio</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />

</head>
<body>
<div class="m-10">
    <header class="flex justify-center w-full mb-4">
        <img src="https://cdn.langeek.co/photo/28255/original/?type=jpeg" alt="audio" class="w-full object-cover h-[400px] rounded-md">
        <h1 class="absolute top-20 text-2xl">audio</h1>
    </header>

    <main class="space-y-4">
        <div class="flex flex-row gap-4">
            <audio id="audio" controls>
                <source src="Aiobahn%20feat.%20KOTOKO%20-%20INTERNET%20YAMERO%20(Official%20Music%20Video)%20%5BTheme%20for%20NEEDY%20GIRL%20OVERDOSE%5D.mp3" type="audio/mpeg">
                Your browser does not support the audio element.
            </audio>
            <div id="ended_div" class="flex flex-row gap-4 text-red-500">

            </div>
        </div>


        <div class="flex flex-row gap-4">
            <button class="bg-sky-300 hover:bg-sky-200 text-gray-800 font-semibold py-2 px-4 border border-black-500 rounded-full cursor-pointer shadow material-symbols-outlined material-symbols-outlined" onclick="togglePlay()">play_pause</button>
            <button class="bg-sky-300 hover:bg-sky-200 text-gray-800 font-semibold py-2 px-4 border border-black-500 rounded-full shadow material-symbols-outlined" onclick="playPositive()">thumb_up</button>
            <button class="bg-sky-300 hover:bg-sky-200 text-gray-800 font-semibold py-2 px-4 border border-black-500 rounded-full shadow material-symbols-outlined" onclick="playNegative()">thumb_down</button>
        </div>

        <div class="flex flex-row gap-10">
            <div class="button-row">
                <button class="bg-sky-300 hover:bg-sky-200 text-gray-800 font-semibold py-2 px-4 border border-black-500 rounded-full shadow material-symbols-outlined" onclick="muteAudio()">volume_off</button>
                <button class="bg-sky-300 hover:bg-sky-200 text-gray-800 font-semibold py-2 px-4 border border-black-500 rounded-full shadow material-symbols-outlined" onclick="setVolume(0.2)">volume_down</button>
                <button class="bg-sky-300 hover:bg-sky-200 text-gray-800 font-semibold py-2 px-4 border border-black-500 rounded-full shadow material-symbols-outlined" onclick="setVolume(1.0)">volume_up</button>
            </div>

            <div class="flex flex-row gap-4">
                <button class="bg-sky-300 hover:bg-sky-200 text-gray-800 font-semibold py-2 px-4 border border-black-500 rounded-full shadow material-symbols-outlined" onclick="setSpeed(0.25)">slow_motion_video</button>
                <button class="bg-sky-300 hover:bg-sky-200 text-gray-800 font-semibold py-2 px-4 border border-black-500 rounded-full shadow material-symbols-outlined" onclick="setSpeed(0.5)">fast_rewind</button>
                <button class="bg-sky-300 hover:bg-sky-200 text-gray-800 font-semibold py-2 px-4 border border-black-500 rounded-full shadow material-symbols-outlined" onclick="setSpeed(1.0)">play_arrow</button>
                <button class="bg-sky-300 hover:bg-sky-200 text-gray-800 font-semibold py-2 px-4 border border-black-500 rounded-full shadow material-symbols-outlined" onclick="setSpeed(1.5)">fast_forward</button>
                <button class="bg-sky-300 hover:bg-sky-200 text-gray-800 font-semibold py-2 px-4 border border-black-500 rounded-full shadow material-symbols-outlined" onclick="setSpeed(2.0)">keyboard_double_arrow_right</button>
            </div>
        </div>

        <div style="display: flex; flex-direction: row; gap: 20px;">
            <div class="flex flex-row gap-4">
                <button class="bg-sky-300 hover:bg-sky-200 text-gray-800 font-semibold py-2 px-4 border border-black-500 rounded-full shadow material-symbols-outlined" onclick="checkEnded()">check</button>
                <button class="bg-sky-300 hover:bg-sky-200 text-gray-800 font-semibold py-2 px-4 border border-black-500 rounded-full shadow material-symbols-outlined" onclick="showDuration()">timer</button>
                <button class="bg-sky-300 hover:bg-sky-200 text-gray-800 font-semibold py-2 px-4 border border-black-500 rounded-full shadow material-symbols-outlined" onclick="showCurrentTime()">schedule</button>
                <button class="bg-sky-300 hover:bg-sky-200 text-gray-800 font-semibold py-2 px-4 border border-black-500 rounded-full shadow" onclick="jumpTo(90)">90</button>
            </div>
        </div>
    </main>

    <footer class="absolute bottom-0 left-0 w-full bg-rose-200 px-2 text-black">
        <ul class="flex flex-row gap-2 justify-between">
            <li>
                forrás
                <a href="https://www.youtube.com/watch?v=51GIxXFKbzk">https://www.youtube.com/watch?v=51GIxXFKbzk</a>
            </li>

        </ul>
    </footer>
    <audio id="negative">
        <source src="no.mp3" type="audio/mpeg">
        Your browser does not support the audio element.
    </audio>
    <audio id="positive">
        <source src="BL_audio.mp3" type="audio/mpeg">
        Your browser does not support the audio element.
    </audio>
</div>

<script>
    const audio = document.getElementById('audio');
    const ended_div = document.getElementById('ended_div');

    audio.addEventListener("timeupdate", function(){
        if(audio.ended){
            ended_div.innerHTML = 'VÉGE';
        }else ended_div.innerHTML = '';
    })

    function playNegative(){
        document.getElementById('negative').play();
    }

    function playPositive(){
        document.getElementById('positive').play();
    }

    function togglePlay(){
        if(audio.paused){
            audio.play();
        }else{
            audio.pause();
        }
    }

    function muteAudio(){
        audio.muted = !audio.muted;
    }


    function setSpeed(rate){
        audio.playbackRate = rate;
    }

    function jumpTo(value){
        audio.currentTime = value;
    }

    function checkEnded(){
        alert(audio.ended ? 'Igen' : 'Nem');
    }

    function showDuration(){
        if(isNaN(audio.duration)){
            alert('Az audio hossza még nem elérhető.');
        }else{
            alert('Az audio teljes hossza: ' + Math.round(audio.duration) + ' mperc');
        }
    }

    function showCurrentTime(){
        alert('Jelenlegi pozíció: ' + Math.round(audio.currentTime) + ' mperc');
    }
</script>

</body>
</html>
